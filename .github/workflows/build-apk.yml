
name: Build SOUQ Android APK and AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Extract project
        run: unzip -q SOUQ_Deutschland_Flutter_Starter.zip -d .

      - name: Check project
        run: |
          test -f souq_deutschland/pubspec.yaml
          test -f souq_deutschland/lib/main.dart

      - name: Generate Android platform
        working-directory: souq_deutschland
        run: |
          flutter create \
            --platforms=android \
            --project-name=souq_deutschland \
            --org=de.souq .

      - name: Get dependencies
        working-directory: souq_deutschland
        run: flutter pub get

      - name: Build Debug APK
        working-directory: souq_deutschland
        run: flutter build apk --debug

      - name: Build Release APK
        working-directory: souq_deutschland
        run: flutter build apk --release

      - name: Build Google Play AAB
        working-directory: souq_deutschland
        run: flutter build appbundle --release

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: SOUQ-Deutschland-APKs
          path: souq_deutschland/build/app/outputs/flutter-apk/*.apk

      - name: Upload Google Play AAB
        uses: actions/upload-artifact@v4
        with:
          name: SOUQ-Deutschland-Play-AAB
          path: souq_deutschland/build/app/outputs/bundle/release/app-release.aab
