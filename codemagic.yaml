workflows:
  souq-android:
    name: SOUQ Deutschland Android
    max_build_duration: 60

    environment:
      flutter: stable

    scripts:
      - name: Extract Flutter project
        script: |
          unzip -o SOUQ_Deutschland_Flutter_Starter.zip -d .
          test -f souq_deutschland/pubspec.yaml

      - name: Install dependencies
        script: |
          cd souq_deutschland
          flutter pub get

      - name: Build Release APK
        script: |
          cd souq_deutschland
          flutter build apk --release

      - name: Build Release AAB
        script: |
          cd souq_deutschland
          flutter build appbundle --release

    artifacts:
      - souq_deutschland/build/app/outputs/flutter-apk/app-release.apk
      - souq_deutschland/build/app/outputs/bundle/release/app-release.aab
